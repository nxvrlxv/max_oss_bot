# Replace app.example.ru everywhere with the domain covered by your certificate.
# Use instead of max-webapp.conf, not alongside it for the same domain.
# Install certificate and key before enabling this configuration.
server {
    listen 80;
    server_name 178.236.254.46;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/max-webapp;
        try_files $uri =404;
    }

    location / {
        return 301 https://app.example.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 178.236.254.46;

    ssl_certificate /etc/nginx/ssl/max-webapp/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/max-webapp/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MaxWebappSSL:10m;
    ssl_session_timeout 1d;

    root /var/www/max-webapp;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }
}
