# Replace app.example.ru with your domain (or server IP for an HTTP check).
# Install inside the http context, e.g. /etc/nginx/sites-available/max-webapp.
server {
    listen 80;
    server_name app.example.ru;

    root /var/www/max-webapp;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ =404;
    }

    # Keep ACME HTTP challenges accessible for HTTPS certificate issuance.
    location ~ /\.(?!well-known/) {
        deny all;
    }
}
